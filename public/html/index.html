    <!-- Modal de feedback (aberto pela sidebar) -->

    <div id="feedback-overlay" class="feedbackOverlay hidden" onclick="fecharFeedback()" aria-hidden="true"></div>
    <section id="feedbackModal" class="feedbackModal hidden" role="dialog" aria-modal="true" aria-labelledby="feedbackModalTitulo">
        <header class="feedbackModal__header">
            <h2 id="feedbackModalTitulo">Envie seu feedback</h2>
            <button type="button" class="feedbackModal__fechar" onclick="fecharFeedback()" aria-label="Fechar">x</button>
        </header>

        <label for="feedbackEmail">Email:</label>
        <input type="email" id="feedbackEmail" name="feedbackEmail" required>

        <form id="feedback-form" onsubmit="enviarFeedback(event)" class="feedbackModal__form">
            <label for="feedbackType">Tipo:</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="">Selecione...</option>
                <option value="sugestao">Sugestão</option>
                <option value="bug">Bug</option>
                <option value="elogio">Elogio</option>
            </select>

            <label for="feedbackText">Deixe seu feedback:</label>
            <textarea id="feedbackText" name="feedback" rows="4" cols="50" required></textarea>

            <div class="feedbackModal__acoes">
                <button type="button" class="feedbackModal__cancelar" onclick="fecharFeedback()">Cancelar</button>
                <button type="submit" class="feedbackModal__enviar">Enviar</button>
            </div>
        </form>
    </section>
