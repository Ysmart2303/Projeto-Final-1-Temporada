services:
  mysql:
    image: mysql:8.4
    container_name: siga-mcvm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: escola
    ports:
      - "3307:3306"
    volumes:
      - siga_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  siga_mysql_data:
