<!DOCTYPE html>
<html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="pj.css">
        <title>Cursos</title>
    </head>
    <body>

    <header>
        <nav class="menu">
            <img id="header-logo" src="/img/mcvm-logo.png" alt="Logo MCVM" onclick="voltar('home')">
            <button onclick="voltar('home')" type="button" id="bntPrime" class="bnt">Voltar</button>
        </nav>

        <h1 id="siga">S.I.G.A. MCVM</h1>
    </header>
   
    <div id="loginTela" class="login-box">
        <h1 class="LC">Login Curso</h1>
        <h2 class="PA">Painel Administrativo</h2>

        <div class="botoesLogin">
            <input type="text" id="userInput" placeholder="Usuário">
            <input type="password" id="senhaInput" placeholder="Senha">
            <button onclick="fazerLogin()" type="button">Logar</button><br><br>
            <BUTTON onclick="cadastroCurso()" type="button">Cadrastrar Curso</BUTTON>
            <p id="errologin"></p>
        </div>
    </div>

    <div id="carregando" style="display:none" class="login-box">
        <h2>Entrando...</h2>
    </div>

    <div id="painel" style=" display: none;">
        <header>
            <h1 id="tituloCurso"></h1>
        </header>
    </div>
    
    <div id="painelCadastro" style="display: none;"  class="login-box">
        <h1>Cadastrar Curso</h1>
       <div class="botoesCadastro">

    <input type="text" id="cursoInput" placeholder="Nome do Curso">

    <input type="text" id="usuarioCurso" placeholder="Usuário">

    <input type="password" id="senhaCurso" placeholder="Senha">

    <input type="email" id="emailCurso" placeholder="@gmail.com">

    <input
    type="text"
    id="nomeProfessor"
    placeholder="Nome do Professor"
>

    <button onclick="criarCurso()">
        Cadastrar
    </button>
    <button onclick="verCursos()">
    Ver Cursos Cadastrados
</button>

<div id="listaCursos"></div>
    

</div>
            <button onclick="voltarLogin()">
                Voltar
            </button>
            <div id="listaCursos"></div>

</div>
    </div>
    
    <script src="pj.js"></script>
</body>
</html>
