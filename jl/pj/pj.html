<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pj.css">
    <title>Cursos - SIGA MCVM</title>
</head>
<body>

    <div id="loginTela" class="login-box">

        <h1 class="LC">Login Administrativo</h1>
        
        <h2 class="PA">Painel Administrativo de Cursos</h2>

        <div class="botoesLogin">
            <input type="text" id="userInput" placeholder="Usuário">
            <input type="password" id="senhaInput" placeholder="Senha">
            <button onclick="fazerLogin()" type="button">Logar</button><br><br>
            <button onclick="cadastroCurso()" type="button">Cadastrar Novo Curso</button>
            <p id="errologin" style="color: #d63031; font-weight: bold;"></p>
        </div>

    </div>

    <div id="carregando" style="display:none" class="login-box">
        <h2>Conectando ao servidor...</h2>
        <p>Por favor, aguarde.</p>
    </div>

    <div id="painel" style="display: none;">
        <header>
            <h1 id="tituloCurso"></h1>
        </header>
    </div>

    <div id="painelCadastro" style="display: none;" class="login-box">

        <h1>Cadastrar Novo Curso</h1>

        <div class="botoesCadastro">

            <input type="text" id="cursoInput" placeholder="Nome do Curso" required>
            <input type="text" id="usuarioCurso" placeholder="Usuário/Login" required>
            <input type="password" id="senhaCurso" placeholder="Senha" required>

            <button onclick="criarCurso()" type="button" style="background-color: #27ae60; color: white;">Cadastrar</button>
            <button onclick="verCursos()" type="button" style="background-color: #3498db; color: white;">Ver Cursos Cadastrados</button>
            <button onclick="voltarLogin()" type="button" style="background-color: #95a5a6; color: white;">Voltar</button>

            <div id="listaCursos" style="margin-top: 20px;"></div>

        </div>

    </div>

    <script type="module" src="pj.js"></script>
</body>
</html>
